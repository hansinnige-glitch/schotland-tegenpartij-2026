<script>
// ============================================================
// JSONBIN CONFIGURATIE — zelfde waarden als in index.html!
// ============================================================
const JSONBIN_API_KEY  = "$2a$10$myIOk23WvhXYSVTjfmUwN.AestPZIBRGdlSuB5dY9/aKx2VwdGFqi";
const JSONBIN_BIN_ID   = "6a0b103eee5a733b12db7f78";

const JSONBIN_FLIGHTS_BIN_ID = "6a0b10646877513b27903c64";
const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_FLIGHTS_BIN_ID}`;

let saveTimeout = null;
let isLoading   = false;

function collectData() {
  const data = {};
  document.querySelectorAll("input[data-key]").forEach(input => {
    data[input.dataset.key] = input.value;
  });
  return data;
}

function applyData(data) {
  isLoading = true;
  document.querySelectorAll("input[data-key]").forEach(input => {
    const val = data[input.dataset.key];
    if (val !== undefined) input.value = val;
  });
  isLoading = false;
}

async function loadFromCloud() {
  try {
    const res = await fetch(JSONBIN_URL + "/latest", {
      headers: { "X-Master-Key": JSONBIN_API_KEY }
    });
    if (!res.ok) throw new Error(res.status);
    const json = await res.json();
    applyData(json.record || {});
    setStatus("✅ Gesynchroniseerd");
  } catch (e) {
    setStatus("⚠️ Laden mislukt – controleer API key/Bin ID");
    console.error("Load error:", e);
  }
}

async function saveToCloud() {
  try {
    setStatus("💾 Opslaan...");
    const res = await fetch(JSONBIN_URL, {
      method:  "PUT",
      headers: {
        "Content-Type": "application/json",
        "X-Master-Key": JSONBIN_API_KEY
      },
      body: JSON.stringify(collectData())
    });
    if (!res.ok) throw new Error(res.status);
    setStatus("✅ Opgeslagen");
  } catch (e) {
    setStatus("⚠️ Opslaan mislukt");
    console.error("Save error:", e);
  }
}

function setStatus(msg) {
  document.getElementById("syncstatus").innerText = msg;
}

document.querySelectorAll("input[data-key]").forEach(input => {
  input.addEventListener("input", () => {
    if (isLoading) return;
    clearTimeout(saveTimeout);
    saveTimeout = setTimeout(saveToCloud, 2000);
  });
});

loadFromCloud();
setInterval(loadFromCloud, 20000);
</script>
